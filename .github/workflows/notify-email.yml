name: Notify Email

# workflow_run 观察者模式：监听全仓所有 workflow 的完成事件，
# 自动携带那次 run 的状态 / commit / 分支 / 耗时 / 链接并发送邮件。
#
# 配置（Settings → Secrets and variables → Actions）：
#   Variables:
#     MAIL_TO           收件人，逗号分隔（必填）
#     MAIL_FROM         发件邮箱（必填）
#     NOTIFY_WORKFLOWS  可选，只监控的 workflow 名清单（逗号分隔，按 name 精确匹配）；
#                       留空/未配置 = 监控全部
#     MAIL_CC / MAIL_SUBJECT / SMTP_HOST / SMTP_PORT / SMTP_USER  可选
#   Secrets:
#     SMTP_PASSWORD     SMTP 授权码（必填；不是登录密码）

on:
  workflow_run:
    types: [completed]
  workflow_dispatch: # 手动触发（测试用，邮件载荷为本次 notify run 自身）

permissions: {} # 纯发邮件，不需要任何 token 权限

jobs:
  notify:
    # 只对成功 / 失败发通知（跳过取消等）；手动触发（workflow_dispatch）不受过滤，用于测试
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    steps:
      # ── 过滤：排除自身 run + 按 NOTIFY_WORKFLOWS 清单精确匹配（留空=全部）──
      - name: Filter watched workflows
        id: guard
        env:
          WATCHED: ${{ vars.NOTIFY_WORKFLOWS }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_PATH: ${{ github.event.workflow_run.path }}
        run: |
          # 1) 排除自身，防自环
          if [ "$RUN_PATH" = ".github/workflows/notify-email.yml" ]; then
            echo "guard: 自身 run，跳过"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 2) 清单为空 = 监控全部
          if [ -z "${WATCHED//[[:space:]],/}" ]; then
            echo "guard: NOTIFY_WORKFLOWS 未配置，监控全部 → $RUN_NAME"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 3) 精确匹配（忽略条目内空白）
          skip=true
          IFS=',' read -ra arr <<< "$WATCHED"
          for item in "${arr[@]}"; do
            item="${item//[[:space:]]/}"
            [ -z "$item" ] && continue
            if [ "$item" = "$RUN_NAME" ]; then
              skip=false
              echo "guard: 命中监听清单 → $RUN_NAME"
              break
            fi
          done
          if [ "$skip" = "true" ]; then
            echo "guard: 不在监听清单，跳过 → $RUN_NAME"
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Send notification email
        if: steps.guard.outputs.skip != 'true'
        env:
          # ── 邮件配置：收发件人与 SMTP（授权码必须走 secrets）──
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          MAIL_TO: ${{ vars.MAIL_TO }}
          MAIL_CC: ${{ vars.MAIL_CC }}
          MAIL_SUBJECT: ${{ vars.MAIL_SUBJECT }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ vars.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          # ── 通知载荷：workflow_run 事件自带，手动触发时回退为本次 run 自身 ──
          REPO_FULL: ${{ github.repository }}
          RUN_NAME: ${{ github.event.workflow_run.name || github.workflow }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion || 'manual-test' }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          RUN_ACTOR: ${{ github.event.workflow_run.actor.login || github.actor }}
          RUN_EVENT: ${{ github.event.workflow_run.event || github.event_name }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number || github.run_number }}
          RUN_ID: ${{ github.event.workflow_run.id || github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id || github.run_id }}
          RUN_STARTED_AT: ${{ github.event.workflow_run.run_started_at || '' }}
          RUN_UPDATED_AT: ${{ github.event.workflow_run.updated_at || '' }}
        run: python3 scripts/send_mail.py
